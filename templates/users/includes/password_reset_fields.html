{% comment %}Fields of the two password-reset forms; errors are tied to their input for screen readers.{% endcomment %}
{% for field in form %}
    <div>
        <label class="block font-mono-editorial text-xs tracking-widest text-muted-foreground mb-1.5" for="{{ field.id_for_label }}">
            {{ field.label|upper }}
        </label>
        {{ field }}
        {% if field.errors %}<div id="{{ field.auto_id }}_error" role="alert">{% for error in field.errors %}
            <p class="mt-1.5 text-xs text-accent">{{ error }}</p>
        {% endfor %}</div>{% endif %}
    </div>
{% endfor %}
