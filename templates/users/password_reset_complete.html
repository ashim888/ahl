{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Password updated" %} — {{ JOURNAL_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20">
    <div class="rule-editorial mb-6"></div>
    <h1 class="font-display text-3xl font-bold" style="letter-spacing: -0.02em;">{% trans "Password updated" %}</h1>
    <p class="mt-4 text-muted-foreground leading-relaxed">{% trans "Your new password is set. Use it the next time you log in." %}</p>
    <a href="{% url 'users:login' %}" class="mt-8 block w-full text-center font-mono-editorial text-xs tracking-widest bg-foreground text-primary-foreground py-3.5 hover:bg-accent transition-colors">{% trans "LOG IN" %}</a>
</div>
{% endblock %}
