{% extends 'base.html' %}

{% block title %}Password reset — {{ JOURNAL_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-24 text-center">
    <h1 class="font-display text-2xl font-bold" style="letter-spacing: -0.02em;">Password updated</h1>
    <p class="mt-4 text-muted-foreground">
        <a href="{% url 'users:login' %}" class="underline hover:text-accent">Log in</a> with your new password.
    </p>
</div>
{% endblock %}
