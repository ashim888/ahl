{# Tagify for the library editor forms: same library and look as the article form. #}
{# tagifyRemote(input, url, options) turns an input into tags whose suggestions come from `url?q=`. #}
<link href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
<style>
    .tagify { width: 100%; --tags-border-color: #e5e7eb; --tags-focus-border-color: #6366f1; --tag-bg: #eef2ff;
              --tag-hover: #e0e7ff; --tag-text-color: #3730a3; --tag-remove-btn-color: #6366f1; border-radius: 0.875rem; }
</style>
<script>
function tagifyRemote(input, url, options) {
    if (!input || !window.Tagify) return;
    var tagify = new Tagify(input, Object.assign({enforceWhitelist: false, dropdown: {enabled: 1, maxItems: 20}}, options || {}));
    var controller = null;
    tagify.on('input', function (e) {
        var query = e.detail.value;
        if (controller) controller.abort();
        controller = new AbortController();
        fetch(url + '?q=' + encodeURIComponent(query), {signal: controller.signal})
            .then(function (r) { return r.json(); })
            .then(function (items) { tagify.whitelist = items.concat(tagify.value); tagify.dropdown.show.call(tagify, query); })
            .catch(function (error) { if (error.name !== 'AbortError') throw error; });
    });
}
</script>
