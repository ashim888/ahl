<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Preview — {{ subject }}</title>
</head>
<body style="margin:0; padding:24px; background:#f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <div style="max-width:640px; margin:0 auto 16px; padding:10px 16px; background:#fffbeb; border:1px solid #fcd34d; border-radius:8px; font-size:13px; color:#92400e;">
        Preview only — nothing has been sent. This is approximately what a subscriber will receive.
    </div>
    <div style="max-width:640px; margin:0 auto; background:#fff; border:1px solid #e5e7eb; border-radius:8px; overflow:hidden;">
        <div style="padding:20px 24px; border-bottom:1px solid #e5e7eb;">
            <p style="margin:0; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:#9ca3af;">Subject</p>
            <h1 style="margin:6px 0 0; font-size:20px; color:#111827;">{{ subject }}</h1>
        </div>
        <div style="padding:24px; color:#111827; font-size:15px; line-height:1.6;">
            {{ body_html|safe }}
            <p style="font-size:12px; color:#888; margin-top:24px;">
                <a href="{{ unsubscribe_url }}" style="color:#888;">Unsubscribe</a>
            </p>
        </div>
    </div>
</body>
</html>
